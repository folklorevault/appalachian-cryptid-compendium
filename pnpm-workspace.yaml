allowBuilds:
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.21
  # Next.js security release (GHSA-vcvr-r3jv-pc5j and the 16.3.8 advisories).
  # Exempt only this reviewed release, including its env and platform binaries.
  - next@16.3.8
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
overrides:
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  # Security overrides — transitive vulnerabilities flagged by pnpm audit / Dependabot
  # brace-expansion: GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, and
  # GHSA-6j4f-fj2g-mc7p supersede the earlier DoS fixes on all maintained lines.
  # Keep both selector ceilings and patch floors current; an old ceiling silently
  # stops matching newer vulnerable versions (as happened with the old <5.0.8 key).
  # The 1.x line MUST stay on 1.x. #103 routed it to 5.x, which resolves fine but breaks at
  # runtime: brace-expansion 1.x is `module.exports = expand` (callable), 5.x moved to a named
  # export, so minimatch@3.1.5's `require('brace-expansion')` yields an object and ESLint dies
  # with "expand is not a function". Semver-valid, API-invalid — tsc and next build miss it.
  "brace-expansion@<1.1.21": ">=1.1.21 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.7": ">=5.0.12 <6.0.0"
  "brace-expansion@>=3.0.0 <3.0.9": ">=5.0.12 <6.0.0"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12 <6.0.0"
  # sharp GHSA-f88m-g3jw-g9cj (inherited libvips CVEs) — force >=0.35.0.
  # Supersedes Next 16.2.x's optionalDependencies.sharp ^0.34.5; Next uses only sharp's stable image API.
  # Bounded <0.36.0 so a future lockfile refresh can't silently jump a breaking sharp major.
  "sharp@<0.35.0": ">=0.35.0 <0.36.0"
  # nanoid GHSA-2v37-7h3g-55p8 — custom generators loop forever when size is 0 (DoS).
  # Reaches us twice: postcss -> nanoid and @sanity/client -> nanoid, both on 3.3.16.
  # Dependabot only raised the <3.3.17 line; the advisory also covers >=4.0.0 <5.1.6, so the
  # second key is here pre-emptively even though nothing resolves into that range today.
  "nanoid@<3.3.17": ">=3.3.17 <7.0.0"
  "nanoid@>=4.0.0 <5.1.6": ">=5.1.6 <7.0.0"
  # js-yaml GHSA-5p4m-2wfm-xmqj — quadratic CPU blowup resolving !!omap (CVE-2026-59870 fix
  # was never backported). Arrives via @eslint/eslintrc -> js-yaml@4.3.0 (dev-only, but the
  # alert is still live). Advisory covers both 3.x and 4.x; 5.x is unaffected, so both keys
  # are majorbounded to avoid dragging anything across a major.
  "js-yaml@>=3.0.0 <3.15.1": ">=3.15.1 <6.0.0"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <6.0.0"
  # browserslist GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g — force >=4.28.7.
  # Reaches us via Next/Babel helper-compilation-targets.
  "browserslist@<=4.28.6": ">=4.28.7 <5.0.0"
  # @humanfs/node GHSA-p498-v437-472g — recursive copy can follow symlinks.
  # Reaches us via ESLint internals; force >=0.16.8.
  "@humanfs/node@<0.16.8": ">=0.16.8 <1.0.0"
  "postcss@<8.5.10": ">=8.5.10"
  "protocol-buffers-schema@<3.6.1": ">=3.6.1"
  "@babel/core@<7.29.6": ">=7.29.6 <8.0.0"

allowBuilds:
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.17
overrides:
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  # Security overrides — transitive vulnerabilities flagged by pnpm audit / Dependabot
  # brace-expansion CVE-2026-13149 + GHSA-mh99-v99m-4gvg (DoS, unbounded expansion, all <=5.0.7)
  # Route each maintained line to its backported patch: 1.1.17 / 2.1.3 / 3.0.5 / 5.0.8
  "brace-expansion@<1.1.17": ">=1.1.17 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.3": ">=2.1.3 <3.0.0"
  "brace-expansion@>=3.0.0 <3.0.5": ">=3.0.5 <4.0.0"
  "brace-expansion@>=4.0.0 <5.0.8": ">=5.0.8"
  # sharp GHSA-f88m-g3jw-g9cj (inherited libvips CVEs) — force >=0.35.0.
  # Supersedes Next 16.2.x's optionalDependencies.sharp ^0.34.5; Next uses only sharp's stable image API.
  "sharp@<0.35.0": ">=0.35.0"
  "postcss@<8.5.10": ">=8.5.10"
  "protocol-buffers-schema@<3.6.1": ">=3.6.1"
  "@babel/core@<7.29.6": ">=7.29.6 <8.0.0"

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.21
overrides:
  # GHSA-5p4m-2wfm-xmqj affects the 3.x and 4.x lines only, so this collapses every js-yaml
  # request onto 5.x. The KEY stays unscoped on purpose — scoping it to the advisory ranges
  # would leave non-matching requests free to pull 3.x/4.x copies back into the studio tree.
  # The VALUE is bounded to 5.x so the range enforces the floor it documents: an open-ended
  # ">=" would resolve to whatever major is newest and float us into an unvetted 6.x on release.
  js-yaml: ">=5.0.0 <6.0.0"
  # Security overrides — transitive vulnerabilities flagged by pnpm audit / Dependabot
  "uuid@<11.1.1": ">=11.1.1"
  "uuid@>=13.0.0 <13.0.1": ">=13.0.1"
  # DOMPurify GHSA-55q2-fjhq-7xh7 and GHSA-p98j-92pf-mc4p: detached
  # subtrees retain executable event handlers after IN_PLACE sanitization hooks.
  # The newer advisory raises the patch boundary to 3.4.16.
  "dompurify@<3.4.16": ">=3.4.16 <4.0.0"
  # nanoid GHSA-2v37-7h3g-55p8 — custom generators loop forever when size is 0 (DoS).
  # Studio resolves three nanoid copies: 3.3.16 (vulnerable), 5.1.16 and 6.0.0 (both already
  # clear). The 4.x/5.x key is a regression guard, not a live fix.
  "nanoid@<3.3.17": ">=3.3.17 <7.0.0"
  "nanoid@>=4.0.0 <5.1.6": ">=5.1.6 <7.0.0"
  # brace-expansion: GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, and
  # GHSA-6j4f-fj2g-mc7p supersede the earlier DoS fixes on all maintained lines.
  # Keep both selector ceilings and patch floors current; an old ceiling silently
  # stops matching newer vulnerable versions (as happened with the old <5.0.8 key).
  # The 1.x line MUST stay on 1.x. #103 routed it to 5.x, which resolves fine but breaks at
  # runtime: brace-expansion 1.x is `module.exports = expand` (callable), 5.x moved to a named
  # export, so minimatch@3.1.5's `require('brace-expansion')` yields an object and ESLint dies
  # with "expand is not a function". Semver-valid, API-invalid — tsc and next build miss it.
  "brace-expansion@<1.1.21": ">=1.1.21 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.7": ">=5.0.12 <6.0.0"
  "brace-expansion@>=3.0.0 <3.0.9": ">=5.0.12 <6.0.0"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12 <6.0.0"
  # undici GHSA-4cwx-7wf7-3272 plus GHSA-3wwx-pv8p-q78v (WebSocket decompression DoS), then the
  # October 2026 batch (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx,
  # GHSA-qrxm-fqhp-jwvm, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-9fm3-97px-rjf6,
  # GHSA-55wc-3pg8-jfw6), which raises the 7.x patch boundary to 7.30.1.
  # Only the 7.x line resolves in the studio tree today, so only it needs lifting.
  "undici@>=7.0.0 <7.30.1": ">=7.30.1 <8.0.0"
  # zod GHSA-mrhx-c7xc-m3w5 — memory exhaustion validating oversized constrained collections.
  # Dev-only (@sanity/eslint-config-studio -> eslint-plugin-react-hooks -> zod@4.5.4).
  "zod@>=4.0.0 <4.6.6": ">=4.6.6 <5.0.0"
  # minimatch GHSA-g3hv-75wg-m249 — DoS via globparts amplification. Fixed only in 11.0.1, never
  # backported. Reaches the studio via @sanity/cli (@oclif/core and friends) on 10.x; 11.x keeps
  # 10.x's CommonJS/ESM named exports. Verified with `sanity build` and `eslint .` after the bump.
  "minimatch@<11.0.1": ">=11.0.1 <12.0.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "smol-toml@<1.6.1": ">=1.6.1"
  # GHSA-7q85-xj36-vmfc (ZIP allocation DoS) and GHSA-vwc7-r8mq-g2x9
  # (extraction through destination symlinks); 0.6.1 fixes both upstream.
  # Include 0.6.0 in the selector; the old ceiling left that vulnerable copy intact.
  "adm-zip@<0.6.1": ">=0.6.1 <0.7.0"
